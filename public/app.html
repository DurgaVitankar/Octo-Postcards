<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500&family=Libre+Baskerville:wght@700&family=Tangerine:wght@400;700&family=Geist+Pixel&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* The page is three screens wide: an empty panel either side of the
   postcard. It opens centred on the postcard and scrolls left and right. */
.scroller {
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden; /* the page always fits the window height */
  overscroll-behavior-x: contain;
}

.track {
  /* Illustration widths, from their heights (85% of the window) and aspect ratios */
  --shelf-w: calc(85vh * 2000 / 1889);
  --mail-w: calc(85vh * 1262 / 2000);
  display: flex;
  width: max-content;
  min-height: 100%;
}

/* Sketchy groundline across the whole page, behind everything. The paintings
   have transparent backgrounds, so the pot, the shelf and the mailbox post
   cover it. Height: 84.5% down the paintings (85vh tall from the top). */
.track { position: relative; }

.groundline {
  position: absolute;
  top: calc(85vh * 0.845 - 0.55vh);
  left: 0;
  width: 100%;
  height: 1.1vh;
  min-height: 8px;
  overflow: visible;
  pointer-events: none;
}

.groundline path {
  fill: none;
  stroke: #e2d4c6;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}

.zone {
  flex: 0 0 auto;
  min-width: 0;
}

/* Side panels are only as wide as the part of each illustration outside the
   postcard's screen, plus 60px at the outer end */
/* Measured from the artwork, not the image edges: the shelf art starts 39px
   into its 2000px image; the mailbox art ends 149px before its 1262px edge */
.zone-left  { width: calc(var(--shelf-w) * (0.75 - 39 / 2000) + 180px); }
.zone-right { width: calc(var(--mail-w) * (0.75 - 149 / 1262) + 340px); }
.zone-center { width: 100vw; }

/* Left panel: bookshelf and plant at its right edge, running off the top of
   the page. A quarter of it peeks into the postcard's screen. */
.zone-left { position: relative; }

.shelf {
  position: absolute;
  top: 0;
  right: 0;
  height: 85vh;
  width: var(--shelf-w);   /* exactly the painting's width, so overlays line up */
  transform: translateX(25%);
}

.bookshelf {
  display: block;
  height: 100%;
  width: auto;
  max-width: none;
  user-select: none;
  pointer-events: none;
}

/* Postcard stand: a transparent cut-out of just the stand, laid exactly over
   it in the illustration. Only the stand grows on hover, not the shelf. */
.stand {
  position: absolute;
  left: 67.800%;
  top: 37.110%;
  width: 24.700%;
  height: 22.234%;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  pointer-events: auto;
}

.stand img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  transform-origin: 50% 100%;
  transition: transform 0.25s ease, filter 0.25s ease;
  user-select: none;
}

.stand:hover img,
.stand:focus-visible img {
  transform: scale(1.06);
  filter: drop-shadow(0 4px 6px rgba(60, 40, 20, 0.18));
}

.stand:focus-visible {
  outline: 2px solid #8a8a8a;
  outline-offset: 6px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .stand { transition: none; }
}

/* The snake plant's leaves are their own layer, laid exactly over the painting
   (the wall behind them is filled in), so they can sway from the pot on hover */
.plant {
  position: absolute;
  left: 59.75%;
  top: 63.314%;
  width: 17.85%;
  height: 23.5%;          /* leaves and pot, so hovering either sets it off */
  pointer-events: auto;
}
.plant img {
  display: block;
  width: 100%;
  height: auto;
  transform-origin: 50% 100%;
  user-select: none;
  pointer-events: none;
}
.plant:hover img, .plant.sway img { animation: plant-sway 1.8s ease-in-out; }
@keyframes plant-sway {
  0%   { transform: skewX(0deg); }
  20%  { transform: skewX(-3.5deg); }
  45%  { transform: skewX(2.6deg); }
  70%  { transform: skewX(-1.4deg); }
  88%  { transform: skewX(0.5deg); }
  100% { transform: skewX(0deg); }
}
@media (prefers-reduced-motion: reduce) { .plant:hover img, .plant.sway img { animation: none; } }

/* Sound on/off, bottom left of the screen */
.sound-toggle {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  left: max(20px, env(safe-area-inset-left, 0px));
  z-index: 30;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #fff;
  color: #1d1d1d;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
  cursor: pointer;
}
.sound-toggle[data-tip] { position: fixed; }   /* the tooltip rule would make it relative */
.sound-toggle:hover { background: #f4f4f4; }
.sound-toggle:focus-visible { outline: 2px solid #1d1d1d; outline-offset: 2px; }
.sound-toggle svg { width: 20px; height: 20px; }
.sound-toggle .when-muted { display: none; }
.sound-toggle[aria-pressed="true"] .when-muted { display: block; }
.sound-toggle[aria-pressed="true"] .when-on { display: none; }
.sound-toggle[data-tip]::after { top: auto; bottom: calc(100% + 8px); left: 0; transform: translate(0, 2px); }
.sound-toggle[data-tip]:hover::after,
.sound-toggle[data-tip]:focus-visible::after { transform: none; }

/* The little bird on the top shelf: hover (or tap) and it chirps */
.bird {
  position: absolute;
  left: 78.1%;
  top: 1.75%;
  width: 5.65%;
  height: 6.1%;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  pointer-events: auto;
}
.bird:focus-visible { outline: 2px solid #8a8a8a; outline-offset: 4px; border-radius: 4px; }

/* Tiny notes that float up when it sings */
.bird-note {
  position: absolute;
  left: 30%;
  top: 0;
  font: 600 13px/1 Georgia, serif;
  color: #8f9fb8;
  pointer-events: none;
  animation: bird-note 1.1s ease-out forwards;
}
@keyframes bird-note {
  from { opacity: 0; transform: translate(0, 0) rotate(-8deg); }
  20% { opacity: 1; }
  to { opacity: 0; transform: translate(var(--dx, 10px), -26px) rotate(8deg); }
}
@media (prefers-reduced-motion: reduce) { .bird-note { display: none; } }

/* Right panel: mailbox with flying letters at its left edge. A quarter of it
   peeks into the postcard's screen, mirroring the bookshelf. */
.zone-right { position: relative; }

/* The frame crops the image's empty right margin so it adds no scroll space */
.mail-frame {
  position: absolute;
  top: 0;
  left: calc(var(--mail-w) * -0.25);
  width: calc(var(--mail-w) * (1 - 149 / 1262));
  height: 85vh;
  overflow: hidden;
}

.mailbox {
  display: block;
  height: 100%;
  width: auto;
  max-width: none;
  user-select: none;
  pointer-events: none;
}

/* Globe on the shelf: a canvas over the painted sphere. On hover it re-projects
   the painting onto a sphere and gives it one decelerating turn on its tilted axis. */
.globe {
  position: absolute;
  left: 64.900%;
  top: 15.670%;
  width: 9.200%;
  height: 9.741%;
  pointer-events: auto;
}

.zone-center {
  position: relative;
  z-index: 1;
  /* Let the pointer reach the bookshelf where it peeks in; only the
     controls and the postcard take clicks */
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  padding: 20px 16px;
}

/* Postcard: white frame with a soft shadow, photo inset inside it */
.postcard {
  /* Portrait width; capped so the card turned on its side still fits the screen */
  --pw: min(370px, calc(28px + (100% - 28px) * 416 / 667), calc(28px + (100vh - 304px) * 416 / 667), calc(28px + (100dvh - 304px) * 416 / 667));
  width: var(--pw);
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.05);
}

.photo-area {
  position: relative;
  width: 100%;
  aspect-ratio: 416 / 667;
  overflow: hidden;
  border-radius: 2px;
}

.photo-area img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Empty state: a quiet surface with a plus in the centre */
.empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  border: 1.5px dashed #e2e2e2;
  border-radius: 2px;
  background: #fafafa;
  color: #b5b5b5;
  font: inherit;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

.empty:hover,
.empty.dragging {
  background: #f4f4f4;
  border-color: #cfcfcf;
  color: #8a8a8a;
}

.empty:focus-visible {
  outline: 2px solid #8a8a8a;
  outline-offset: 2px;
}

.plus {
  width: 26px;
  height: 26px;
  border: 1px solid currentColor;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.empty:hover .plus { transform: scale(1.05); }

/* Label sits below the plus without pushing it off centre */
.add-label {
  position: absolute;
  top: calc(50% + 25px);
  font-size: 13px;
  letter-spacing: 0.01em;
  opacity: 0;
  transition: opacity 0.2s;
}

.empty:hover .add-label,
.empty:focus-visible .add-label { opacity: 1; }

/* Replace control shown over a filled postcard */
.replace {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 10px;
  border: none;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #333;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}

/* The photo is placed by script so it can be moved and zoomed in the frame */
#photo {
  position: absolute;
  max-width: none;
  max-height: none;
  object-fit: fill;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
}

#photo.panning { cursor: grabbing; }
#photo:focus-visible { outline: 2px solid #8a8a8a; outline-offset: -4px; }

/* A short hint while hovering a photo */
.photo-hint {
  position: absolute;
  left: 50%;
  bottom: 10px;
  z-index: 3;
  transform: translateX(-50%);
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #333;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}

.photo-area:hover .photo-hint { opacity: 1; }
.photo-area:has(#photo.panning) .photo-hint { opacity: 0; }

.photo-area:hover .replace,
.replace:focus-visible { opacity: 1; }

/* Controls row above the postcard */
.controls {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Front / back toggle and rotate button share the pill style */

.side-toggle,
.rotate-pill {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: #fafafa;
  border-radius: 14px;
}

.side-toggle button,
.rotate-pill button {
  width: 44px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #111;
  cursor: pointer;
  transition: background 0.15s;
}

.side-toggle button:hover,
.rotate-pill button:hover { background: #f4f4f4; }

/* Tooltips: shown below each control on hover or keyboard focus */
[data-tip] { position: relative; }

[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translate(-50%, -2px);
  padding: 5px 8px;
  border-radius: 6px;
  background: #1d1d1d;
  color: #fff;
  font-size: 12px;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s, transform 0.12s;
}

[data-tip]:hover::after,
[data-tip]:focus-visible::after {
  opacity: 1;
  transform: translate(-50%, 0);
  transition-delay: 0.25s;
}

@media (hover: none) {
  [data-tip]:hover::after { opacity: 0; }
}

/* The tool tiles sit at the bottom of the screen: their tooltips go above, and
   stay level and normal-sized while the tile tilts and grows on hover */
.tool[data-tip]::after {
  top: auto;
  bottom: calc(100% + 10px);
  transform: translate(-50%, 2px) rotate(calc(-1 * var(--r))) scale(0.87);
}
.tool[data-tip]:hover::after,
.tool[data-tip]:focus-visible::after { transform: translate(-50%, 0) rotate(calc(-1 * var(--r))) scale(0.87); }
.side-toggle button[aria-pressed="true"] { background: #efefef; }

.side-toggle button:focus-visible,
.rotate-pill button:focus-visible {
  outline: 2px solid #8a8a8a;
  outline-offset: 1px;
}

/* Back of the postcard: postcard header, stamp, address and lined message.
   Sizes use cqmin (the card's short side) so both orientations match. */
.back-area {
  --ink: #1d1d1d;
  --rule: #e6e3df;
  --hint: #c9c5c7;
  --mauve: #a8979e;
  --script: 'Dancing Script', 'Apple Chancery', 'Segoe Script', cursive;
  width: 100%;
  aspect-ratio: 416 / 667;
  container-type: size;
  display: grid;
  padding: 12px;
  column-gap: 16px;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto 1fr;
  grid-template-areas:
    "head stamp"
    "addr stamp"
    "msg  msg";
}

.back-head { grid-area: head; padding-top: 1cqmin; }

.back-title {
  font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  font-weight: 700;
  font-size: 4.2cqmin;
  letter-spacing: 0.22em;
  color: var(--ink);
}

.back-sub {
  font-family: var(--script);
  font-size: 4.8cqmin;
  line-height: 1;
  color: var(--mauve);
}

.stamp { grid-area: stamp; width: 28cqmin; padding-top: 1cqmin; /* top aligns with the heading */ }
.stamp svg { display: block; width: 100%; height: auto; overflow: visible; }

.address {
  grid-area: addr;
  display: flex;
  flex-direction: column;
  max-width: 60cqw;
  margin-top: 3cqmin;
}

.address input,
.message {
  width: 100%;
  border: none;
  background: transparent;
  color: #3a3a3a;
  font-family: var(--write-font, var(--font-hand));
  font-size: var(--write-size, 8.5cqmin);
}

/* Writing font, switched by the "Aa" tool: handwritten (default) or typewriter */
:root {
  --font-hand: 'Tangerine', 'Apple Chancery', 'Segoe Script', cursive;
  --font-type: 'Geist Pixel', 'Geist Mono', 'Courier New', monospace;
}

.font-typewriter .back-area {
  --write-font: var(--font-type);
  --write-size: 4.4cqmin;
}

.address input {
  border-bottom: 1px solid var(--rule);
  padding: 2cqmin 1cqmin 0.4cqmin;
  line-height: 9cqmin; /* same row height in both fonts */
}

.message {
  grid-area: msg;
  margin-top: 7cqmin;
  padding: 0 1cqmin;
  line-height: 9.5cqmin;
  resize: none;
  /* Ruled lines that scroll with the text */
  background-image: repeating-linear-gradient(to bottom,
    transparent 0 calc(9.5cqmin - 1px),
    var(--rule) calc(9.5cqmin - 1px) 9.5cqmin);
  background-attachment: local;
}

.address input::placeholder,
.message::placeholder { color: var(--hint); }
.address input:focus,
.message:focus { outline: none; }
.address input:focus { border-bottom-color: #cfcac4; }

.back-divider { grid-area: div; display: none; background: var(--rule); }

/* Landscape back: message on the left, address side on the right */
.postcard.landscape .back-area {
  aspect-ratio: 667 / 416;
  grid-template-columns: 1.35fr 1px 1fr auto;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "msg div head stamp"
    "msg div addr addr";
}

.postcard.landscape .back-divider {
  display: block;
  margin-block: -26px;
}

.postcard.landscape .address {
  align-self: end;
  max-width: none;
  margin-top: 0;
}

.postcard.landscape .message { margin-top: 6cqmin; }

/* Stage keeps the portrait card's height in both orientations,
   so rotating never moves the controls above it */
.stage {
  display: grid;
  overflow-x: clip;
  justify-items: center;
  align-items: center;
  width: 100%;
}

.stage > * { grid-area: 1 / 1; }

.ghost {
  --pw: min(370px, calc(28px + (100% - 28px) * 416 / 667), calc(28px + (100vh - 304px) * 416 / 667), calc(28px + (100dvh - 304px) * 416 / 667));
  width: var(--pw);
  padding: 14px;
  visibility: hidden;
}

.ghost div { aspect-ratio: 416 / 667; }

/* Landscape orientation */
/* Landscape is the portrait card turned on its side: same dimensions, swapped */
.postcard.landscape { width: calc(28px + (var(--pw) - 28px) * 667 / 416); }
.postcard.landscape .photo-area,
.postcard.landscape .back-area { aspect-ratio: 667 / 416; }

/* The rotate button shows the orientation it will switch to */
.rotate-pill .icon-portrait { display: none; }
.postcard-landscape .rotate-pill .icon-portrait { display: block; }
.postcard-landscape .rotate-pill .icon-landscape { display: none; }

.controls,
.postcard,
.tools { pointer-events: auto; }

/* Tools under the postcard: hand-drawn tiles that zoom and fill with colour */
.tools {
  display: flex;
  justify-content: center;
  margin-top: 24px;
}

/* Spacing, tilt and height measured from the mock-up (cards ~400px there, 112px here) */
.tool:nth-child(2) { margin-left: -4px; }
.tool:nth-child(3) { margin-left: -4px; }
.tool:nth-child(4) { margin-left: -4px; }

/* The left card sits over the middle one so "Aa" isn't covered */
.tool:nth-child(1) { z-index: 1; }

.tool:hover,
.tool:focus-visible { z-index: 2; }

.tool {
  --r: 0deg;
  --y: 0px;
  --fill: #f3efe9;
  position: relative;
  /* four tiles fit any width: 112px, smaller on narrow screens */
  width: clamp(64px, calc((100vw - 32px) / 4 + 3px), 112px);
  aspect-ratio: 1;
  height: auto;
  container-type: size;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
  transform: translateY(var(--y)) rotate(var(--r));
  transform-origin: 50% 50%;
  transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
}

.tool:nth-child(1) { --r: 8deg;  --y: 0px;  --fill: #f1ece4; }
.tool:nth-child(2) { --r: -5deg; --y: -3px; --fill: #e3ebfa; }
.tool:nth-child(3) { --r: 8deg;  --y: -5px; --fill: #fbe5ea; }
.tool:nth-child(4) { --r: -6deg; --y: -2px; --fill: #e6efe3; }

.tool svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.tool path {
  fill: #fff;
  stroke: #c8b09a; /* light brown */
  stroke-width: 1.25;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  transition: fill 0.2s ease, stroke 0.2s ease;
}

/* Live "Aa" preview in the current writing font */
.font-preview {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hand);
  font-size: 52cqw;
  font-weight: 700;
  line-height: 1;
  color: #111;
  pointer-events: none;
  user-select: none;
}

.font-typewriter .font-preview {
  font-family: var(--font-type);
  font-size: 41cqw;
  font-weight: 400;
}

/* the paper plane sits a little smaller than the other pictures */
#toolSend img { max-width: 50%; max-height: 50%; }

.tool img {
  position: absolute;
  inset: 0;
  margin: auto;
  max-width: 64%;
  max-height: 64%;
  pointer-events: none;
  user-select: none;
}

/* Hover: the whole card grows up from its base and sits above its neighbours */
.tool:hover,
.tool:focus-visible { transform: translateY(var(--y)) rotate(var(--r)) scale(1.15); }

.tool:hover path,
.tool:focus-visible path { fill: var(--fill); stroke: #8c6d55; /* lighter shelf brown */ }

.tool:focus-visible { outline: none; }
.tool:focus-visible path { stroke: #8c6d55; }

@media (prefers-reduced-motion: reduce) {
  .tool, .tool path { transition: none; }
}

/* Stamp tray: opens below the postcard, above the tools, as one row */
/* Takes the tools' place while open */
.stamp-tray {
  max-width: 100%;
  margin-top: 24px;
  padding: 12px 10px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 2px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.05);
  pointer-events: auto;
}

.stamp-grid {
  display: flex;
  gap: 20px;
  overflow-x: auto;
}

.tray-stamp {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 84px;
  padding: 4px;
  border: none;
  border-radius: 10px;
  background: transparent;
  cursor: grab;
  touch-action: none;
  transition: background 0.15s, transform 0.15s;
}

.tray-stamp img {
  max-width: 100%;
  max-height: 100%;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 1px 2px rgba(60, 40, 20, 0.18));
}

<script>
  const empty = document.getElementById('empty');
  const photo = document.getElementById('photo');
  const replace = document.getElementById('replace');
  const fileInput = document.getElementById('fileInput');
  let currentUrl = null;

  // Read the photo in as image data (works inside sandboxed viewers that refuse blob: links)
  // Reposition the photo: drag to move it within the frame, double-click to
  // recentre. It always fills the frame. The framing is kept as "which point of
  // the photo sits in the middle", so it survives rotating and resizing.
  const framer = (function () {
    const frame = document.getElementById('photoArea');
    let cx = 0.5, cy = 0.5;

    function layout() {
      const fw = frame.clientWidth, fh = frame.clientHeight;
      const iw = photo.naturalWidth, ih = photo.naturalHeight;
      if (!fw || !fh || !iw || !ih || photo.hidden) return;
      const s = Math.max(fw / iw, fh / ih);            // "cover" size
      const w = iw * s, h = ih * s;
      const hx = fw / 2 / w, hy = fh / 2 / h;          // keep the frame covered
      cx = Math.min(1 - hx, Math.max(hx, cx));
      cy = Math.min(1 - hy, Math.max(hy, cy));
      photo.style.width = w + 'px';
      photo.style.height = h + 'px';
      photo.style.left = (fw / 2 - cx * w) + 'px';
      photo.style.top = (fh / 2 - cy * h) + 'px';
    }
    function reset() { cx = cy = 0.5; layout(); }

    photo.addEventListener('load', layout);
    if (window.ResizeObserver) new ResizeObserver(layout).observe(frame);

    // Drag to move
    let last = null, id = null;
    photo.addEventListener('pointerdown', e => {
      if (e.button > 0 || id !== null) return;
      e.preventDefault();
      id = e.pointerId;
      last = { x: e.clientX, y: e.clientY };
      try { photo.setPointerCapture(id); } catch (_) {}
      photo.classList.add('panning');
    });
    photo.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      if (e.pointerType === 'mouse' && (e.buttons & 1) === 0) { end(e); return; }
      cx -= (e.clientX - last.x) / photo.offsetWidth;

  (function () {

      if (pressed) return;

      const anchors = [0, document.querySelector('.zone-left').offsetWidth, max];
      const x = scroller.scrollLeft;
      const near = anchors.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);
      const pull = Math.min(120, scroller.clientWidth * 0.12);
      const d = Math.abs(near - x);
      if (d > 1 && d <= pull) scroller.scrollTo({ left: near, behavior: reduce ? 'auto' : 'smooth' });

    window.addEventListener('pointerup', () => { pressed = false; clearTimeout(timer); timer = setTimeout(settle, 180); });

  (function () {
    const bird = document.getElementById('bird');
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null, last = 0;

    function audio() {
      if (!AC) return null;
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
    // Unlock sound on the first click or key press anywhere
    const unlock = () => { audio(); window.removeEventListener('pointerdown', unlock, true); window.removeEventListener('keydown', unlock, true); };
    window.addEventListener('pointerdown', unlock, true);
    window.addEventListener('keydown', unlock, true);

    function chirp(ac, at, f0, f1, len, vol) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, at);
      o.frequency.exponentialRampToValueAtTime(f1, at + len * 0.7);

      g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g).connect(ac.destination);
      o.start(at);
      o.stop(at + len + 0.02);
    }

    function sing() {
      const now = performance.now();

  // A calm afternoon outdoors, heard only on the mailbox side: a soft low

  (function () {

  // Home, on the bookshelf side: soft, slow piano-like music over a gentle chord
  // progression, and now and then someone turning a newspaper page. Made with
  // Web Audio at low volume, generated as it plays (it never loops); it fades in

  (function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    const scroller = document.getElementById('scroller');

    if (!AC || !scroller || !leftZone) return;

    let tick = null, nextBeat = 0, beat = 0, pageTimer = null;

    const midi = m => 440 * Math.pow(2, (m - 69) / 12);
    // Fmaj7, Cmaj7/E, Am7, G(add9): slow and warm
    const CHORDS = [
      { bass: 41, tones: [53, 57, 60, 64] },
      { bass: 40, tones: [52, 55, 59, 62] },
      { bass: 45, tones: [52, 55, 57, 60] },
      { bass: 43, tones: [50, 55, 57, 59] },
    ];
    const BEAT = 0.85;                       // seconds per beat, 4 beats a chord

    function build() {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0;
      const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 1100; tone.Q.value = 0.3;
      master.connect(tone).connect(ctx.destination);

      g.gain.setValueAtTime(0.0001, t);

      g.gain.exponentialRampToValueAtTime(0.0001, t + len);

  // Globe spin: turn the painted globe on its tilted axis. The painting only
  // shows one side, so a wrap-around map is built from its crisp centre (120°
  // of longitude), repeated three times with blended seams. Nothing is taken
  // from the squeezed edges, so nothing stretches as it turns.
  (function () {
    const canvas = document.getElementById('globe');
    if (!canvas || !canvas.getContext) return;
    const CX = 1390, CY = 388, R = 92;      // sphere in the 2000px illustration
    const EDGE = 0.965;                      // redraw out to the painted ink outline
    const TILT = 22 * Math.PI / 180;         // axis leans right, like the pin
    const BAND = 2 * Math.PI / 3;            // 120° band, repeated 3x around
    const BLEND = 10 * Math.PI / 180;        // seam crossfade
    const TW = 240, TH = 240;                // map resolution (lon x lat)

    const ctx = canvas.getContext('2d');
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

    // Point on the painted sphere -> source colour (bilinear)
    function sample(src, S, lon, lat, out, k) {
      const x = Math.cos(lat) * Math.sin(lon), y = Math.sin(lat);
      const u = x * cosT - y * sinT, v = x * sinT + y * cosT;
      const fx = Math.min(S - 1.001, Math.max(0, (u + 1) / 2 * S - 0.5));
      const fy = Math.min(S - 1.001, Math.max(0, (v + 1) / 2 * S - 0.5));
      const x0 = fx | 0, y0 = fy | 0, ax = fx - x0, ay = fy - y0, d = src.data;
      for (let c = 0; c < 3; c++) {
        const i00 = (y0 * S + x0) * 4 + c, i10 = i00 + 4, i01 = i00 + S * 4, i11 = i01 + 4;
        const top = d[i00] + (d[i10] - d[i00]) * ax, bot = d[i01] + (d[i11] - d[i01]) * ax;
        out[k + c] = top + (bot - top) * ay;

    const img = new Image();
    img.src = 'bookshelf.webp';
    img.onload = () => {
      const S = 2 * R, c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      g.drawImage(img, CX - R, CY - R, S, S, 0, 0, S, S);
      let src;
      try { src = g.getImageData(0, 0, S, S); } catch (e) { return; }
      tex = new Float32Array(TW * TH * 3);
      const a = [0, 0, 0], b = [0, 0, 0];
      for (let j = 0; j < TH; j++) {
        // caps above 60° reuse the 60° row: the painting is squeezed there too
        const lat = Math.max(-1.05, Math.min(1.05, ((j + 0.5) / TH - 0.5) * Math.PI));
        for (let i = 0; i < TW; i++) {
          const lon = ((i + 0.5) / TW - 0.5) * BAND;        // -60°..60°
          sample(src, S, lon, lat, a, 0);
          let w = 0, other = 0;
          if (lon > BAND / 2 - BLEND) { w = 0.5 * (lon - (BAND / 2 - BLEND)) / BLEND; other = lon - BAND; }
          else if (lon < -BAND / 2 + BLEND) { w = 0.5 * ((-BAND / 2 + BLEND) - lon) / BLEND; other = lon + BAND; }
          if (w > 0) sample(src, S, other, lat, b, 0);
          const k = (j * TW + i) * 3;
          for (let ch = 0; ch < 3; ch++) tex[k + ch] = a[ch] * (1 - w) + b[ch] * w;

    };

    function draw(rot, alpha) {
      const rect = canvas.getBoundingClientRect();
      const N = Math.max(8, Math.round(rect.width * (window.devicePixelRatio || 1)));
      if (canvas.width !== N) { canvas.width = canvas.height = N; }
      const out = ctx.createImageData(N, N), o = out.data;
      for (let py = 0; py < N; py++) {
        for (let px = 0; px < N; px++) {
          const u = (px + 0.5) / N * 2 - 1, v = (py + 0.5) / N * 2 - 1;
          const r = Math.sqrt(u * u + v * v);
          if (r > EDGE) continue;
          const x = u * cosT + v * sinT, y = -u * sinT + v * cosT;   // axis frame
          const z = Math.sqrt(Math.max(0, 1 - x * x - y * y));
          const lat = Math.asin(Math.max(-1, Math.min(1, y)));
          let lon = Math.atan2(x, z) - rot + BAND / 2;
          lon = ((lon % BAND) + BAND) % BAND;                         // into the band
          const fi = Math.min(TW - 1, lon / BAND * TW);
          const fj = Math.min(TH - 1, (lat / Math.PI + 0.5) * TH);
          const k = ((fj | 0) * TW + (fi | 0)) * 3, oi = (py * N + px) * 4;
          const shade = 0.84 + 0.16 * Math.sqrt(z);                   // round-ball edge shading
          o[oi] = tex[k] * shade; o[oi + 1] = tex[k + 1] * shade; o[oi + 2] = tex[k + 2] * shade;

      }
      ctx.putImageData(out, 0, 0);
    }

      if (spinning || !tex || reduce) return;

      const start = performance.now(), dur = 1500, turn = BAND;   // one pass of the pattern
      const ease = t => 1 - Math.pow(1 - t, 3);

        const t = Math.min(1, (now - start) / dur);
        // fade in fast, fade out as it settles, so it hands back to the painting
        const alpha = Math.min(1, t / 0.06, (1 - t) / 0.2);
        draw(turn * ease(t), alpha);
        if (t < 1) requestAnimationFrame(frame);
        else { spinning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
      })(start);
    });
  })();

    grid.addEventListener('pointerdown', e => {
      const btn = e.target.closest('.tray-stamp');
      if (!btn || e.button > 0) return;
      e.preventDefault();
      document.querySelectorAll('.flower-ghost').forEach(g => g.remove());
      const id = btn.dataset.flower, sx = e.clientX, sy = e.clientY;
      let ghost = null;
      track(e, btn, {
        onMove(x, y) {
          if (!ghost && Math.hypot(x - sx, y - sy) < 5) return;
          if (!ghost) {
            ghost = document.createElement('img');
            ghost.className = 'flower-ghost';
            ghost.src = `flowers/flower-${id}.webp`;
            ghost.alt = '';
            ghost.style.width = flowerWidth(decor()) + 'px';   // same size it will land at
            document.body.appendChild(ghost);
          }
          ghost.style.left = x + 'px';
          ghost.style.top = y + 'px';
          card.classList.toggle('drop-ok', inside(decor(), x, y));
        },
        onEnd(x, y, ok) {
          card.classList.remove('drop-ok');
          const layer = decor();
          if (!ghost) {                                     // a plain click drops it on the card
            if (!ok) return;
            const r = layer.getBoundingClientRect();
            place(layer, id, r.left + r.width * (0.2 + Math.random() * 0.6),
                  r.top + r.height * (0.2 + Math.random() * 0.6), randomTilt());
            return;
          }
          if (ok && inside(layer, x, y)) {
            place(layer, id, x, y, -6 + randomTilt() / 2);
            ghost.remove();
          } else {                                          // float back to the tray
            const b = btn.getBoundingClientRect(), g = ghost;
            g.classList.add('landing');
            requestAnimationFrame(() => {
              g.style.left = (b.left + b.width / 2) + 'px';
              g.style.top = (b.top + b.height / 2) + 'px';
              g.style.opacity = '0';
            });
            setTimeout(() => g.remove(), 200);
          }
        }
      });
    });

    // Remove a flower: its × button, Delete/Backspace when selected, or drag it off
    function removeFlower(el) {
      el.classList.add('removing');
      setTimeout(() => el.remove(), 180);
    }
    const select = el => {
      document.querySelectorAll('.flower.selected').forEach(f => { if (f !== el) f.classList.remove('selected'); });
      if (el) el.classList.add('selected');
    };
    card.addEventListener('click', e => {
      const btn = e.target.closest('.flower-remove');
      if (btn) { e.stopPropagation(); removeFlower(btn.closest('.flower')); }
    });
    document.addEventListener('pointerdown', e => { if (!e.target.closest('.flower')) select(null); });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Delete' && e.key !== 'Backspace') return;
      if (e.target.closest && e.target.closest('input, textarea')) return;
      const sel = document.querySelector('.flower.selected');
      if (sel) { e.preventDefault(); removeFlower(sel); }
    });

    // Move a placed flower, or drag it off the card to remove it
    card.addEventListener('pointerdown', e => {
      if (e.target.closest('.flower-remove')) return;
      const img = e.target.closest('.flower');
      if (!img || e.button > 0) return;
      e.preventDefault();
      e.stopPropagation();
      select(img);
      const layer = img.parentElement;
      layer.appendChild(img);                              // bring to the front
      img.classList.add('dragging');
      track(e, img, {
        onMove(x, y) {
          const r = layer.getBoundingClientRect();
          img.style.left = ((x - r.left) / r.width * 100) + '%';
          img.style.top = ((y - r.top) / r.height * 100) + '%';
          img.classList.toggle('leaving', !inside(layer, x, y));
        },
        onEnd(x, y) {
          img.classList.remove('dragging');
          if (!inside(layer, x, y)) removeFlower(img);
        }
      });
    });
  })();

  // Stamp tray: the Stamp tool opens a tray of stamps beside the postcard.
  // Drag one onto the stamp box on the back, or click it, to place it.
  (function () {
    const STAMPS = [
      ['yarrow', 'Yarrow'], ['peppermint', 'Peppermint'], ['rosemary', 'Rosemary'],
      ['anemone', 'Anemone'], ['lotus', 'Lotus'], ['laurel', 'Laurel']
    ];
    const tool = document.getElementById('toolStamp');
    const tray = document.getElementById('stampTray');
    const grid = document.getElementById('stampGrid');
    const slot = document.getElementById('stampSlot');
    const placed = document.getElementById('stampImg');
    const backArea = document.getElementById('backArea');
    let current = null;   // id of the stamp on the postcard, or null

    STAMPS.forEach(([id, name]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tray-stamp';
      b.dataset.stamp = id;
      b.setAttribute('aria-label', `${name} stamp`);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<img src="stamps/stamp-${id}.webp" alt="" draggable="false">`;
      grid.appendChild(b);
    });

    // Show the current state on the postcard and in the tray
    function render() {
      if (current) {
        placed.setAttribute('href', `stamps/stamp-${current}.webp`);
        placed.style.visibility = 'visible';
        slot.style.visibility = 'hidden';
      } else {
        placed.removeAttribute('href');
        placed.style.visibility = 'hidden';
        slot.style.visibility = 'visible';
      }
      grid.querySelectorAll('.tray-stamp').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.stamp === current)));
    }
    window.postcardStamps = { clear() { current = null; render(); } };

    function showBack() { if (backArea.hidden) setSide('back'); }

    const tools = document.querySelector('.tools');
    function open() {
      tray.hidden = false;
      tools.hidden = true;
      tool.setAttribute('aria-expanded', 'true');
      showBack();
    }
    function close() {
      tray.hidden = true;
      tools.hidden = false;
      tool.setAttribute('aria-expanded', 'false');
    }
    tool.setAttribute('aria-expanded', 'false');
    tool.addEventListener('click', () => (tray.hidden ? open() : close()));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !tray.hidden) close(); });
    // Clicking anywhere outside the tray and the postcard brings the tools back
    document.addEventListener('pointerdown', e => {
      if (tray.hidden || e.target.closest('#stampTray, #postcard, .controls')) return;
      close();
    });

    function overSlot(x, y) {
      const r = slot.getBoundingClientRect(), pad = 16;
      return r.width > 0 && x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
    }

    // Drag with a floating copy that follows the pointer (mouse, pen or touch)
    grid.addEventListener('pointerdown', e => {
      const btn = e.target.closest('.tray-stamp');
      if (!btn || e.button > 0) return;
      e.preventDefault();
      document.querySelectorAll('.stamp-ghost').forEach(g => g.remove());   // never leave a stray copy
      const id = btn.dataset.stamp, sx = e.clientX, sy = e.clientY;
      let ghost = null, done = false, lastX = sx, lastY = sy;
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}

      const move = ev => {
        if (ev.pointerId !== e.pointerId) return;
        // button already released (e.g. let go outside the frame): finish here
        if (ev.pointerType === 'mouse' && (ev.buttons & 1) === 0) {
          end({ type: 'pointerup', clientX: ev.clientX, clientY: ev.clientY });
          return;
        }
        lastX = ev.clientX; lastY = ev.clientY;
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
        if (!ghost) {
          showBack();
          ghost = document.createElement('img');
          ghost.className = 'stamp-ghost';
          ghost.src = `stamps/stamp-${id}.webp`;
          ghost.alt = '';
          document.body.appendChild(ghost);
          // while dragging, show the empty box as the target
          placed.style.visibility = 'hidden';
          slot.style.visibility = 'visible';
        }
        ghost.style.left = ev.clientX + 'px';
        ghost.style.top = ev.clientY + 'px';
        const hot = overSlot(ev.clientX, ev.clientY);
        slot.classList.toggle('hot', hot);
        ghost.classList.toggle('snap', hot);
        ghost.style.width = hot ? slot.getBoundingClientRect().width + 'px' : '';
      };
      const end = ev => {
        if (done) return;
        done = true;
        window.removeEventListener('pointermove', move, true);
        window.removeEventListener('pointerup', end, true);
        window.removeEventListener('pointercancel', cancel, true);
        window.removeEventListener('blur', cancel);
        btn.removeEventListener('lostpointercapture', lost);
        slot.classList.remove('hot');
        if (!ghost) {                                  // a plain click toggles that stamp
          if (ev.type === 'pointerup') current = (current === id) ? null : id;
          render();
          return;
        }
        const g = ghost, dropped = ev.type === 'pointerup' && overSlot(ev.clientX, ev.clientY);
        // glide into the box, or float back to the tray, then hand over
        const target = (dropped ? slot : btn).getBoundingClientRect();
        g.classList.add('landing');
        g.classList.toggle('snap', dropped);
        requestAnimationFrame(() => {
          g.style.left = (target.left + target.width / 2) + 'px';
          g.style.top = (target.top + target.height / 2) + 'px';
          g.style.width = (dropped ? target.width : 40) + 'px';
          if (!dropped) g.style.opacity = '0';
        });
        setTimeout(() => {
          if (dropped) current = id;
          render();
          g.remove();
        }, 190);
      };
      // Any way a drag can finish ends it: release, cancel, lost capture, window blur
      const cancel = () => end({ type: 'pointercancel', clientX: lastX, clientY: lastY });
      const lost = () => setTimeout(() => end({ type: 'pointerup', clientX: lastX, clientY: lastY }), 0);
      window.addEventListener('pointermove', move, true);
      window.addEventListener('pointerup', end, true);
      window.addEventListener('pointercancel', cancel, true);
      window.addEventListener('blur', cancel);
      btn.addEventListener('lostpointercapture', lost);
    });

    // Keyboard: Enter / Space on a stamp toggles it
    grid.addEventListener('keydown', e => {
      const btn = e.target.closest('.tray-stamp');
      if (!btn || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      showBack();
      current = (current === btn.dataset.stamp) ? null : btn.dataset.stamp;
      render();
    });
  })();

  // Send flow: the Send tile asks who the postcard is for, then the card flies
  // across the page into the mailbox's slot, and a note
  // confirms where it's going. The email goes out through /api/send while the
  // card is in the air; if it fails, the note says so instead.
  (function () {
    const dlg = document.getElementById('sendDialog');
    const form = document.getElementById('sendForm');
    const email = document.getElementById('sendEmail');
    const err = document.getElementById('sendError');
    const card = document.getElementById('postcard');
    const scroller = document.getElementById('scroller');
    const mailboxImg = document.querySelector('.mailbox');
    const note = document.getElementById('sentNote');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let busy = false;

    // Slot position inside the mailbox painting (1262 x 2000)
    const SLOT = { x: 170 / 1262, y: 1058 / 2000, w: 190 / 1262 };

    function openDialog() {
      if (busy) return;
      err.hidden = true;
      email.removeAttribute('aria-invalid');
      // Came from "Send a postcard back": start with the sender's address
      try {
        const reply = localStorage.getItem('postcards.replyTo');
        if (reply) { if (!email.value) email.value = reply; localStorage.removeItem('postcards.replyTo'); }
      } catch (_) {}
      if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
      setTimeout(() => email.focus(), 50);
    }

    document.getElementById('toolSend').addEventListener('click', openDialog);
    document.getElementById('sendCancel').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   // click outside
    email.addEventListener('input', () => { err.hidden = true; email.removeAttribute('aria-invalid'); });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const to = email.value.trim();
      if (!to || !email.checkValidity()) {
        err.textContent = to ? "That doesn't look like an email address." : 'Enter the email address to send it to.';
        err.hidden = false;
        email.setAttribute('aria-invalid', 'true');
        email.focus();
        return;
      }
      dlg.close();
      fly(to);
    });

    // Gather the card and email it through /api/send. Resolves to
    // { ok: true } or { ok: false, error }.
    function photoForEmail() {
      const img = document.getElementById('photo');
      if (img.hidden || !img.naturalWidth) return Promise.resolve(null);
      // shrink to at most 1600px on the long side, as JPEG, to keep the email light
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      try { return Promise.resolve(c.toDataURL('image/jpeg', 0.85)); } catch (_) { return Promise.resolve(null); }
    }

    // Snapshot both faces of the card exactly as designed (fonts, stamp box,
    // postmark, ruled lines, flowers, the photo's framing) for the email.
    // Email apps ignore web fonts and most layout, so pictures look the same everywhere.
    const H2I = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
    function loadH2I() {
      if (window.htmlToImage) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = H2I; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // The card's web fonts as self-contained CSS (fonts inlined), so the
    // snapshot uses Tangerine, Libre Baskerville and Geist Pixel. Fetched once.
    let fontCSSCache = null;
    async function fontCSS() {
      if (fontCSSCache) return fontCSSCache;
      const link = document.querySelector('link[href*="fonts.googleapis.com/css2"]');
      if (!link) return '';
      const css = await (await fetch(link.href)).text();
      // keep only the latin subsets: what the card uses, and far fewer files
      const blocks = css.split(/(?=\/\* )/).filter(b => /^\/\* latin \*\//.test(b));
      const asData = async url => {
        const blob = await (await fetch(url)).blob();
        return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      };
      const out = await Promise.all(blocks.map(async b => {
        const m = /url\((https:[^)]+)\)/.exec(b);
        return m ? b.replace(m[1], await asData(m[1])) : b;
      }));
      return (fontCSSCache = out.join('\n'));
    }

    async function cardFaces() {
      try { await loadH2I(); } catch (_) { return null; }
      const holder = document.createElement('div');
      holder.style.cssText = 'position:fixed;left:-20000px;top:0;width:2000px;pointer-events:none;';
      document.body.appendChild(holder);
      const make = side => {
        const c = card.cloneNode(true);
        c.removeAttribute('id');
        c.style.cssText = '';
        c.style.boxShadow = 'none';
        c.style.width = card.getBoundingClientRect().width + 'px';   // same size as on screen
        const src = card.querySelectorAll('input, textarea'), dst = c.querySelectorAll('input, textarea');
        dst.forEach((el, i) => { el.setAttribute('value', src[i].value); el.textContent = src[i].value; el.value = src[i].value; });
        const front = c.querySelector('.photo-area'), back = c.querySelector('.back-area');
        front.hidden = side !== 'front';
        back.hidden = side !== 'back';
        c.querySelectorAll('.empty, .replace, .photo-hint, .file-input').forEach(el => { el.hidden = true; });
        c.querySelectorAll('.flower-remove').forEach(el => el.remove());
        c.querySelectorAll('.flower').forEach(el => el.classList.remove('selected'));
        holder.appendChild(c);
        return c;
      };
      let fontEmbedCSS = '';
      try { fontEmbedCSS = await fontCSS(); } catch (_) {}
      const opts = { pixelRatio: 2, quality: 0.9, backgroundColor: '#ffffff', fontEmbedCSS };
      try {
        const f = make('front'), b = make('back');
        if (document.fonts) await document.fonts.ready;
        const [front, back] = await Promise.all([htmlToImage.toJpeg(f, opts), htmlToImage.toJpeg(b, opts)]);
        return { front, back };
      } catch (_) {
        return null;
      } finally {
        holder.remove();
      }
    }

    async function deliver(to) {
      const val = id => (document.getElementById(id).value || '').trim();
      const stampHref = document.getElementById('stampImg').getAttribute('href') || '';
      const stamp = (/stamp-([a-z]+)\.webp/.exec(stampHref) || [])[1] || null;
      const faces = await cardFaces();
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            recipientEmail: to,
            message: val('message'),
            to: { name: val('toName') },
            photo: faces ? null : await photoForEmail(),
            front: faces ? faces.front : null,
            back: faces ? faces.back : null,
            orientation: card.classList.contains('landscape') ? 'landscape' : 'portrait',
            stamp,
            font: document.body.classList.contains('font-typewriter') ? 'type' : 'hand',
            accessToken: await window.postcardsAuth.token()
          })
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) setTimeout(() => location.assign('/login.html'), 3200);
        if (!res.ok) return { ok: false, error: data.error || "The postcard couldn't be sent. Please try again." };
        return { ok: true };
      } catch (_) {
        return { ok: false, error: "Couldn't reach the post office. Check your connection and try again." };
      }
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));
    function scrollAndSettle(left) {
      scroller.scrollTo({ left, behavior: reduce ? 'auto' : 'smooth' });
      return new Promise(resolve => {
        let last = -1, still = 0;
        (function check() {
          const x = scroller.scrollLeft;
          still = Math.abs(x - last) < 0.5 ? still + 1 : 0;
          last = x;
          if (still > 4) resolve(); else requestAnimationFrame(check);
        })();
      });
    }

    // A frozen copy of the card (with what's typed in it) to fly
    function snapshot() {
      const r = card.getBoundingClientRect();
      const copy = card.cloneNode(true);
      copy.removeAttribute('id');
      copy.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
      const src = card.querySelectorAll('input, textarea'), dst = copy.querySelectorAll('input, textarea');
      dst.forEach((el, i) => { el.value = src[i].value; el.setAttribute('value', src[i].value); el.textContent = src[i].value; el.tabIndex = -1; });
      Object.assign(copy.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 60, pointerEvents: 'none', transformOrigin: '50% 50%' });
      copy.classList.add('flying-card');
      document.body.appendChild(copy);
      return { copy, r };
    }

    function showNote(to, error) {
      const m = mailboxImg.getBoundingClientRect();
      note.classList.toggle('error', !!error);
      note.innerHTML = error ? '' : 'On its way to <span></span>';
      if (error) note.textContent = error; else note.querySelector('span').textContent = to;
      note.hidden = false;
      note.style.left = '0px';
      const w = note.offsetWidth;
      const x = Math.min(window.innerWidth - w - 16, Math.max(16, m.left + SLOT.x * m.width - w * 0.7));
      note.style.left = x + 'px';
      note.style.top = Math.max(16, m.top + SLOT.y * m.height - 110) + 'px';
      requestAnimationFrame(() => note.classList.add('show'));
    }
    function hideNote() {
      note.classList.remove('show');
      setTimeout(() => { note.hidden = true; }, 300);
    }

    // Flight path (viewport px), after the reference video: a short run to the
    // right, one round loop-the-loop (a prolate cycloid, so the curvature is
    // smooth everywhere), then a gentle glide into the mailbox slot.
    function flightPath(a, b, u) {
      const span = b.x - a.x;
      const d = Math.min(u * 0.42, span * 0.2);       // loop half-height
      const R = 0.2 * d;                              // small drift = a round loop
      const lead = 0.22 * span;
      const pts = [[a.x, a.y]];
      // lead-in, level and to the right
      for (let i = 1; i <= 20; i++) pts.push([a.x + lead * i / 20, a.y]);
      // the loop: x = R s - d sin s, y = d (1 - cos s), s from π to 3π
      const x0 = a.x + lead - (R * Math.PI), y0 = a.y - 2 * d;
      for (let i = 1; i <= 160; i++) {
        const s = Math.PI + 2 * Math.PI * i / 160;
        pts.push([x0 + R * s - d * Math.sin(s), y0 + d * (1 - Math.cos(s))]);
      }
      // glide from the bottom of the loop into the slot (cubic, tangent-matched)
      const e = pts[pts.length - 1], gx = b.x - e[0];
      const c1 = [e[0] + 0.45 * gx, e[1]], c2 = [b.x - 0.35 * gx, b.y + 0.08 * (e[1] - b.y)];
      for (let i = 1; i <= 60; i++) {
        const t = i / 60, mt = 1 - t;
        pts.push([
          mt * mt * mt * e[0] + 3 * mt * mt * t * c1[0] + 3 * mt * t * t * c2[0] + t * t * t * b.x,
          mt * mt * mt * e[1] + 3 * mt * mt * t * c1[1] + 3 * mt * t * t * c2[1] + t * t * t * b.y
        ]);
      }
      return 'M ' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
    }

    // Fly the card along the path. The whole flight is worked out up front and
    // handed to the browser as one animation, so it stays smooth even while the
    // page is busy (it's taking the pictures of the card for the email then).
    // The dashed trail is the same smooth curve, revealed behind the card.
    function along(copy, r, b, s) {
      const NS = 'http://www.w3.org/2000/svg';
      const a = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      const d = flightPath(a, b, Math.min(320, Math.max(160, r.height * 0.55)));

      const trailSvg = document.createElementNS(NS, 'svg');
      trailSvg.setAttribute('class', 'flight-trail');
      const mask = document.createElementNS(NS, 'mask');
      mask.id = 'trailReveal';
      mask.setAttribute('maskUnits', 'userSpaceOnUse');
      ['x', 'y'].forEach(k => mask.setAttribute(k, '-5000'));
      ['width', 'height'].forEach(k => mask.setAttribute(k, '10000'));
      const reveal = document.createElementNS(NS, 'path');
      reveal.setAttribute('d', d);
      reveal.setAttribute('class', 'trail-reveal');
      mask.appendChild(reveal);
      const trail = document.createElementNS(NS, 'path');
      trail.setAttribute('d', d);
      trail.setAttribute('mask', 'url(#trailReveal)');
      trailSvg.append(mask, trail);
      document.body.insertBefore(trailSvg, copy);

      const len = trail.getTotalLength(), dur = 3200, N = 240;
      const portrait = r.height > r.width;
      const frames = [];
      let prev = null, wind = 0, alignTo = null;
      for (let i = 0; i <= N; i++) {
        const t = i / N, e = t;                           // constant pace along the whole path
        const p = trail.getPointAtLength(e * len);
        const q = trail.getPointAtLength(Math.min(len, e * len + 1));
        const p0 = e * len >= len - 1 ? trail.getPointAtLength(len - 2) : p;
        // turn with the path like the reference video, at half the path's turn,
        // so it banks through the loop and comes out upside down
        let raw = Math.atan2(q.y - p0.y, q.x - p0.x) * 180 / Math.PI;
        if (prev !== null) {
          while (raw + wind - prev > 180) wind -= 360;
          while (raw + wind - prev < -180) wind += 360;
        }
        prev = raw + wind;
        let ang = 0.5 * prev;
        // At the mailbox, line the card up with the horizontal slot (long side
        // level) before it slips in: blend to the nearest such angle
        if (alignTo === null && t > 0.6) {
          const step = 180, offset = portrait ? 90 : 0;
          alignTo = Math.round((ang - offset) / step) * step + offset;
        }
        if (alignTo !== null) {
          const k2 = Math.min(1, Math.max(0, (t - 0.68) / 0.2));
          const sm = k2 * k2 * (3 - 2 * k2);
          ang = ang + (alignTo - ang) * sm;
        }
        const k = 1 - Math.pow(1 - e, 1.6);
        const scale = 1 + (s - 1) * k;
        frames.push({ offset: t, transform: `translate(${(p.x - a.x).toFixed(2)}px, ${(p.y - a.y).toFixed(2)}px) rotate(${ang.toFixed(2)}deg) scale(${scale.toFixed(4)})` });
      }

      const flight = copy.animate(frames, { duration: dur, easing: 'linear', fill: 'forwards' });
      reveal.style.strokeDasharray = `${len} ${len}`;
      reveal.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, easing: 'linear', fill: 'forwards' });
      return flight.finished.then(() => {
        // keep the final pose for the drop into the slot
        copy.style.transform = frames[N].transform;
        flight.cancel();
        trailSvg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, delay: 500, fill: 'forwards' })
          .finished.then(() => trailSvg.remove());
      });
    }

    // Slip the card down through the slot: everything below the slot line is
    // hidden, so the card looks like it goes inside the mailbox
    function dropIn(copy, slotY, visH) {
      const clip = document.createElement('div');
      clip.className = 'slot-clip';
      clip.style.height = slotY + 'px';
      document.body.appendChild(clip);
      clip.appendChild(copy);
      copy.style.position = 'absolute';
      const base = copy.style.transform;
      return copy.animate([
        { transform: base },
        { transform: `translate(0, ${visH + 3}px) ${base}` }
      ], { duration: 520, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'forwards' })
        .finished.then(() => clip.remove());
    }

    // After a successful send: clear the photo, writing, stamp and flowers,
    // and show the front. Orientation and the chosen font stay as they were.
    function resetCard() {
      photo.removeAttribute('src');
      photo.hidden = true;
      replace.hidden = true;
      document.getElementById('photoHint').hidden = true;
      empty.hidden = false;
      ['toName', 'message'].forEach(id => { document.getElementById(id).value = ''; });
      if (window.postcardStamps) window.postcardStamps.clear();
      document.querySelectorAll('.decor .flower').forEach(f => f.remove());
      applySide(false);
      email.value = '';
    }

    async function fly(to) {
      busy = true;
      document.body.classList.add('sending');
      const centre = document.querySelector('.zone-left').offsetWidth;
      const moved = Math.abs(scroller.scrollLeft - centre) > 2;
      const sending = deliver(to);          // send while the card is in the air
      try {
        // the card and the mailbox slot are both in view from the postcard's spot
        if (moved) await scrollAndSettle(centre);
        let m = mailboxImg.getBoundingClientRect();
        let b = { x: m.left + SLOT.x * m.width, y: m.top + SLOT.y * m.height };
        if (b.x > window.innerWidth - 10) {          // very narrow screens: bring the slot into view
          await scrollAndSettle(scroller.scrollLeft + (b.x - window.innerWidth) + 60);
          m = mailboxImg.getBoundingClientRect();
          b = { x: m.left + SLOT.x * m.width, y: m.top + SLOT.y * m.height };
        }
        if (!reduce) {
          const { copy, r } = snapshot();
          // opacity, not visibility: the placed stamp sets its own visibility,
          // which would keep it showing on an invisible card
          card.style.opacity = '0';
          // once level, the card's long side should just fit the slot
          const s = Math.max(0.04, (SLOT.w * m.width * 0.85) / Math.max(r.width, r.height));
          const visH = Math.min(r.width, r.height) * s;      // its height once level
          // fly to just above the slot, then drop through it
          await along(copy, r, { x: b.x, y: b.y - visH / 2 - 1 }, s);
          await dropIn(copy, b.y, visH);
          copy.remove();
        }
        const result = await sending;
        showNote(to, result.ok ? null : result.error);
        if (result.ok) resetCard();             // sent: a fresh, empty card waits
        await wait(result.ok ? 2400 : 4200);
        hideNote();
        if (Math.abs(scroller.scrollLeft - centre) > 2) await scrollAndSettle(centre);
      } finally {
        if (getComputedStyle(card).opacity === '0' && !reduce) {
          card.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
            { duration: 450, easing: 'ease-out' });
        }
        card.style.opacity = '';
        document.body.classList.remove('sending');
        busy = false;
      }
    }
  })();

  // Front / back toggle
  const photoArea = document.getElementById('photoArea');
  const backArea = document.getElementById('backArea');
  const showFront = document.getElementById('showFront');
  const showBack = document.getElementById('showBack');

  function applySide(back) {
    photoArea.hidden = back;
    backArea.hidden = !back;
    showFront.setAttribute('aria-pressed', String(!back));
    showBack.setAttribute('aria-pressed', String(back));
  }

  // Flip the card over: turn it edge-on, swap sides, turn it back
  function setSide(side) {
    const back = side === 'back';
    if (back === !backArea.hidden || rotating) return;
    const card = document.getElementById('postcard');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !card.animate) { applySide(back); return; }

    rotating = true;
    const dir = back ? 1 : -1;
    const half = { duration: 200 };
    const out = card.animate(
      [
        { transform: 'perspective(2400px) rotateY(0deg)' },
        { transform: `perspective(2400px) rotateY(${90 * dir}deg)` }
      ],
      { ...half, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    out.onfinish = () => {
      applySide(back);
      const inn = card.animate(
        [
          { transform: `perspective(2400px) rotateY(${-90 * dir}deg)` },
          { transform: 'perspective(2400px) rotateY(0deg)' }
        ],
        { ...half, easing: 'cubic-bezier(0, 0, 0.2, 1)' }
      );
      out.cancel();
      inn.onfinish = () => { rotating = false; };
    };
  }
  showFront.addEventListener('click', () => setSide('front'));
  showBack.addEventListener('click', () => setSide('back'));

  // Rotate between portrait and landscape
  const postcard = document.getElementById('postcard');
  const rotate = document.getElementById('rotate');
  let rotating = false;

  function applyOrientation(landscape) {
    postcard.classList.toggle('landscape', landscape);
    document.body.classList.toggle('postcard-landscape', landscape);
    const label = landscape ? 'Rotate to portrait' : 'Rotate to landscape';
    rotate.setAttribute('aria-label', label);
    rotate.dataset.tip = label;
  }

  rotate.addEventListener('click', () => {
    if (rotating) return;
    const toLandscape = !postcard.classList.contains('landscape');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !postcard.animate) { applyOrientation(toLandscape); return; }

    // Measure the target size so the turned card lands exactly on it
    const from = postcard.getBoundingClientRect();
    postcard.classList.toggle('landscape', toLandscape);
    const to = postcard.getBoundingClientRect();
    postcard.classList.toggle('landscape', !toLandscape);
    const scale = to.width / from.height;

    // Fade out what's printed on the card while it turns, so the switch to the
    // other layout happens while it's invisible (the empty-state plus stays put)
    const content = [backArea, photo].filter(el => !el.hidden && !el.parentElement.hidden);
    const fadeOuts = content.map(el => el.animate(
      [{ opacity: 1 }, { opacity: 0 }],
      { duration: 160, easing: 'ease-out', fill: 'forwards' }
    ));

    // Quarter turn around the card's centre: anticlockwise to landscape, clockwise back
    const angle = toLandscape ? -90 : 90;
    rotating = true;
    const anim = postcard.animate(
      [
        { transform: 'rotate(0deg) scale(1)' },
        { transform: `rotate(${angle}deg) scale(${scale})` }
      ],
      { duration: 400, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' }
    );
    anim.onfinish = () => {
      applyOrientation(toLandscape);
      content.forEach(el => el.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 180, easing: 'ease-in' }
      ));
      fadeOuts.forEach(a => a.cancel());
      rotating = false;
    };
  });

  // Drop an image file onto the front (empty or filled) to add or replace the photo
  const dropZone = document.getElementById('photoArea');
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  dropZone.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); dropZone.classList.add('dragging'); });
  dropZone.addEventListener('dragleave', e => { if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('dragging'); });
  dropZone.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dropZone.classList.remove('dragging');
    showPhoto([...e.dataTransfer.files].find(f => f.type.startsWith('image/')));
  });

  // Paste an image (Cmd/Ctrl+V) to add it as the photo, unless typing in a field
  document.addEventListener('paste', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
    if (!item) return;
    e.preventDefault();
    showPhoto(item.getAsFile());
  });
</script>

</body>
</html>
