<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500&family=Libre+Baskerville:wght@700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px 16px 14vh;
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Postcard: white frame with a soft shadow, photo inset inside it */
.postcard {
  /* Portrait width; capped so the card turned on its side still fits the screen */
  --pw: min(400px, calc(28px + (100% - 28px) * 416 / 667));
  width: var(--pw);
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.05);
}

.photo-area {
  position: relative;
  width: 100%;
  aspect-ratio: 416 / 667;
  overflow: hidden;
  border-radius: 2px;
}

.photo-area img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Empty state: a quiet surface with a plus in the centre */
.empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  border: 1.5px dashed #e2e2e2;
  border-radius: 2px;
  background: #fafafa;
  color: #b5b5b5;
  font: inherit;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

.empty:hover,
.empty.dragging {
  background: #f4f4f4;
  border-color: #cfcfcf;
  color: #8a8a8a;
}

.empty:focus-visible {
  outline: 2px solid #8a8a8a;
  outline-offset: 2px;
}

.plus {
  width: 26px;
  height: 26px;
  border: 1px solid currentColor;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.empty:hover .plus { transform: scale(1.05); }

/* Label sits below the plus without pushing it off centre */
.add-label {
  position: absolute;
  top: calc(50% + 25px);
  font-size: 13px;
  letter-spacing: 0.01em;
  opacity: 0;
  transition: opacity 0.2s;
}

.empty:hover .add-label,
.empty:focus-visible .add-label { opacity: 1; }

/* Replace control shown over a filled postcard */
.replace {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 10px;
  border: none;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #333;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}

.photo-area:hover .replace,
.replace:focus-visible { opacity: 1; }

/* Controls row above the postcard */
.controls {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Front / back toggle and rotate button share the pill style */
.side-toggle,
.rotate-pill {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: #fafafa;
  border-radius: 14px;
}

.side-toggle button,
.rotate-pill button {
  width: 44px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #111;
  cursor: pointer;
  transition: background 0.15s;
}

.side-toggle button:hover,
.rotate-pill button:hover { background: #f4f4f4; }

/* Tooltips: shown below each control on hover or keyboard focus */
[data-tip] { position: relative; }

[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translate(-50%, -2px);
  padding: 5px 8px;
  border-radius: 6px;
  background: #1d1d1d;
  color: #fff;
  font-size: 12px;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s, transform 0.12s;
}

[data-tip]:hover::after,
[data-tip]:focus-visible::after {
  opacity: 1;
  transform: translate(-50%, 0);
  transition-delay: 0.25s;
}

@media (hover: none) {
  [data-tip]:hover::after { opacity: 0; }
}
.side-toggle button[aria-pressed="true"] { background: #efefef; }

.side-toggle button:focus-visible,
.rotate-pill button:focus-visible {
  outline: 2px solid #8a8a8a;
  outline-offset: 1px;
}

/* Back of the postcard: postcard header, stamp, address and lined message.
   Sizes use cqmin (the card's short side) so both orientations match. */
.back-area {
  --ink: #1d1d1d;
  --rule: #e6e3df;
  --hint: #c9c5c7;
  --mauve: #a8979e;
  --script: 'Dancing Script', 'Apple Chancery', 'Segoe Script', cursive;
  width: 100%;
  aspect-ratio: 416 / 667;
  container-type: size;
  display: grid;
  padding: 12px;
  column-gap: 16px;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto 1fr;
  grid-template-areas:
    "head stamp"
    "addr stamp"
    "msg  msg";
}

.back-head { grid-area: head; padding-top: 1cqmin; }

.back-title {
  font-family: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
  font-weight: 700;
  font-size: 4.2cqmin;
  letter-spacing: 0.22em;
  color: var(--ink);
}

.back-sub {
  font-family: var(--script);
  font-size: 4.8cqmin;
  line-height: 1;
  color: var(--mauve);
}

.stamp { grid-area: stamp; width: 28cqmin; }
.stamp svg { display: block; width: 100%; height: auto; overflow: visible; }

.address {
  grid-area: addr;
  display: flex;
  flex-direction: column;
  max-width: 60cqw;
  margin-top: 3cqmin;
}

.address input,
.message {
  width: 100%;
  border: none;
  background: transparent;
  color: #3a3a3a;
  font-family: var(--script);
  font-size: 6cqmin;
}

.address input {
  border-bottom: 1px solid var(--rule);
  padding: 2cqmin 1cqmin 0.4cqmin;
}

.message {
  grid-area: msg;
  margin-top: 7cqmin;
  padding: 0 1cqmin;
  line-height: 9.5cqmin;
  resize: none;
  /* Ruled lines that scroll with the text */
  background-image: repeating-linear-gradient(to bottom,
    transparent 0 calc(9.5cqmin - 1px),
    var(--rule) calc(9.5cqmin - 1px) 9.5cqmin);
  background-attachment: local;
}

.address input::placeholder,
.message::placeholder { color: var(--hint); }
.address input:focus,
.message:focus { outline: none; }
.address input:focus { border-bottom-color: #cfcac4; }

.back-divider { grid-area: div; display: none; background: var(--rule); }

/* Landscape back: message on the left, address side on the right */
.postcard.landscape .back-area {
  aspect-ratio: 667 / 416;
  grid-template-columns: 1.35fr 1px 1fr auto;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "msg div head stamp"
    "msg div addr addr";
}

.postcard.landscape .back-divider {
  display: block;
  margin-block: -26px;
}

.postcard.landscape .address {
  align-self: end;
  max-width: none;
  margin-top: 0;
}

.postcard.landscape .message { margin-top: 6cqmin; }

/* Stage keeps the portrait card's height in both orientations,
   so rotating never moves the controls above it */
.stage {
  display: grid;
  overflow-x: clip;
  justify-items: center;
  align-items: center;
  width: 100%;
}

.stage > * { grid-area: 1 / 1; }

.ghost {
  --pw: min(400px, calc(28px + (100% - 28px) * 416 / 667));
  width: var(--pw);
  padding: 14px;
  visibility: hidden;
}

.ghost div { aspect-ratio: 416 / 667; }

/* Landscape orientation */
/* Landscape is the portrait card turned on its side: same dimensions, swapped */
.postcard.landscape { width: calc(28px + (var(--pw) - 28px) * 667 / 416); }
.postcard.landscape .photo-area,
.postcard.landscape .back-area { aspect-ratio: 667 / 416; }

/* The rotate button shows the orientation it will switch to */
.rotate-pill .icon-portrait { display: none; }
.postcard-landscape .rotate-pill .icon-portrait { display: block; }
.postcard-landscape .rotate-pill .icon-landscape { display: none; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="controls">
<div class="rotate-pill">
  <button type="button" id="rotate" aria-label="Rotate to landscape" data-tip="Rotate to landscape">
    <!-- Custom icons: landscape (Frame) and portrait (Frame 74) -->
    <svg class="icon-landscape" width="24" height="24" viewBox="-0.67 -1 16 16" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1.66602 3.66699L2.99935 5.00033L4.33268 3.66699"/><path d="M3 5.00033L3 3.00033C3 2.26395 3.65124 1.66699 4.45455 1.66699L7 1.66699"/><path d="M12.7092 12.3337L4.62027 12.3337C4.46071 12.3337 4.33138 12.2342 4.33138 12.1114L4.33138 5.88921C4.33138 5.76648 4.46071 5.66699 4.62027 5.66699L12.7092 5.66699C12.8687 5.66699 12.998 5.76648 12.998 5.88921L12.998 12.1114C12.998 12.2342 12.8687 12.3337 12.7092 12.3337Z"/></svg>
    <svg class="icon-portrait" width="24" height="24" viewBox="3.33 3 16 16" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8.66602 4.66699L9.99935 6.00033L8.66602 7.33366"/><path d="M9.99935 6H7.99935C7.26297 6 6.66602 6.65124 6.66602 7.45455V10"/><path d="M15.9987 8.95588V17.0448C15.9987 17.2043 15.8992 17.3337 15.7765 17.3337H9.55425C9.43152 17.3337 9.33203 17.2043 9.33203 17.0448V8.95588C9.33203 8.79633 9.43152 8.66699 9.55425 8.66699H15.7765C15.8992 8.66699 15.9987 8.79633 15.9987 8.95588Z"/></svg>
  </button>
</div>

<div class="side-toggle" role="group" aria-label="Postcard side">
  <button type="button" id="showFront" aria-pressed="true" aria-label="Front" data-tip="Front">
    <!-- Custom icon: front (Frame) -->
    <svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3327 4.28889V12.3778C11.3327 12.5373 11.2332 12.6667 11.1105 12.6667H4.88824C4.76551 12.6667 4.66602 12.5373 4.66602 12.3778V4.28889C4.66602 4.12934 4.76551 4 4.88824 4H11.1105C11.2332 4 11.3327 4.12934 11.3327 4.28889Z"/></svg>
  </button>
  <button type="button" id="showBack" aria-pressed="false" aria-label="Back" data-tip="Back">
    <!-- Custom icon: back (Frame 1) -->
    <svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.3327 4.28889V12.3778C11.3327 12.5373 11.2332 12.6667 11.1105 12.6667H4.88824C4.76551 12.6667 4.66602 12.5373 4.66602 12.3778V4.28889C4.66602 4.12934 4.76551 4 4.88824 4H11.1105C11.2332 4 11.3327 4.12934 11.3327 4.28889Z"/><path d="M6.66602 6.66699H9.33268"/><path d="M6.66602 8.33301H9.33268"/><path d="M6.66602 10H9.33268"/></svg>
  </button>
</div>
</div>

<div class="stage">
<div class="ghost" aria-hidden="true"><div></div></div>
<div class="postcard" id="postcard">
  <div class="photo-area" id="photoArea">
    <button class="empty" id="empty" type="button" aria-label="Add photo">
      <span class="plus" aria-hidden="true">
        <!-- Remix Icon: add-line (Apache 2.0) -->
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges"><path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"/></svg>
      </span>
      <span class="add-label">Add photo</span>
    </button>
    <img id="photo" alt="Postcard photo" hidden>
    <button class="replace" id="replace" type="button" hidden>Replace</button>
  </div>
  <div class="back-area" id="backArea" hidden>
    <div class="back-head">
      <div class="back-title">POSTCARD</div>
      <div class="back-sub">with love</div>
    </div>
    <div class="stamp" aria-hidden="true">
      <svg viewBox="0 0 100 92" fill="none">
        <rect x="34" y="8" width="58" height="56" rx="1.5" stroke="#c9a6ad" stroke-width="1.2" stroke-dasharray="3 2"/>
        <rect x="42" y="0" width="54" height="56" rx="2" fill="#eeece9"/>
        <defs><path id="pmArc" d="M 12 54 A 26 26 0 0 1 64 54"/><path id="pmArcLow" d="M 16 62 A 23 23 0 0 0 60 62"/></defs>
        <circle cx="38" cy="58" r="31" stroke="#cdc3c7" stroke-width="1"/>
        <circle cx="38" cy="58" r="27" stroke="#cdc3c7" stroke-width="0.6"/>
        <text font-family="'Libre Baskerville', Georgia, serif" font-size="5.2" letter-spacing="1.6" fill="#b9adb2"><textPath href="#pmArc" startOffset="50%" text-anchor="middle">YOUR LOCATION</textPath></text>
        <text font-family="'Libre Baskerville', Georgia, serif" font-size="5.2" letter-spacing="1.4" fill="#b9adb2"><textPath href="#pmArcLow" startOffset="50%" text-anchor="middle" id="pmDate">SEP 2026</textPath></text>
        <path d="M 6 58 q 7 -6 14 0 t 14 0 t 14 0 t 14 0 t 14 0 t 14 0" stroke="#cdc3c7" stroke-width="1"/>
      </svg>
    </div>
    <div class="address">
      <input type="text" id="toName" placeholder="Name" aria-label="Name" autocomplete="off">
      <input type="text" id="toAddress" placeholder="Address" aria-label="Address" autocomplete="off">
      <input type="text" id="toCity" placeholder="City, Country" aria-label="City and country" autocomplete="off">
      <input type="text" id="toPostal" placeholder="Postal code" aria-label="Postal code" autocomplete="off">
    </div>
    <div class="back-divider"></div>
    <textarea class="message" id="message" placeholder="Write your message…" aria-label="Message"></textarea>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>
</div>
</div>

<script>
  const empty = document.getElementById('empty');
  const photo = document.getElementById('photo');
  const replace = document.getElementById('replace');
  const fileInput = document.getElementById('fileInput');
  let currentUrl = null;

  function showPhoto(file) {
    if (!file || !file.type.startsWith('image/')) return;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(file);
    photo.src = currentUrl;
    photo.hidden = false;
    replace.hidden = false;
    empty.hidden = true;
  }

  empty.addEventListener('click', () => fileInput.click());
  replace.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    showPhoto(fileInput.files[0]);
    fileInput.value = '';
  });

  // Load the back's fonts up front so the first flip doesn't re-render text
  if (document.fonts) {
    document.fonts.load('16px "Dancing Script"');
    document.fonts.load('700 16px "Libre Baskerville"');
  }

  // Postmark shows the current month and year
  document.getElementById('pmDate').textContent =
    new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' }).toUpperCase();

  // Front / back toggle
  const photoArea = document.getElementById('photoArea');
  const backArea = document.getElementById('backArea');
  const showFront = document.getElementById('showFront');
  const showBack = document.getElementById('showBack');

  function applySide(back) {
    photoArea.hidden = back;
    backArea.hidden = !back;
    showFront.setAttribute('aria-pressed', String(!back));
    showBack.setAttribute('aria-pressed', String(back));
  }

  // Flip the card over: turn it edge-on, swap sides, turn it back
  function setSide(side) {
    const back = side === 'back';
    if (back === !backArea.hidden || rotating) return;
    const card = document.getElementById('postcard');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !card.animate) { applySide(back); return; }

    rotating = true;
    const dir = back ? 1 : -1;
    const half = { duration: 200 };
    const out = card.animate(
      [
        { transform: 'perspective(2400px) rotateY(0deg)' },
        { transform: `perspective(2400px) rotateY(${90 * dir}deg)` }
      ],
      { ...half, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    out.onfinish = () => {
      applySide(back);
      const inn = card.animate(
        [
          { transform: `perspective(2400px) rotateY(${-90 * dir}deg)` },
          { transform: 'perspective(2400px) rotateY(0deg)' }
        ],
        { ...half, easing: 'cubic-bezier(0, 0, 0.2, 1)' }
      );
      out.cancel();
      inn.onfinish = () => { rotating = false; };
    };
  }
  showFront.addEventListener('click', () => setSide('front'));
  showBack.addEventListener('click', () => setSide('back'));

  // Rotate between portrait and landscape
  const postcard = document.getElementById('postcard');
  const rotate = document.getElementById('rotate');
  let rotating = false;

  function applyOrientation(landscape) {
    postcard.classList.toggle('landscape', landscape);
    document.body.classList.toggle('postcard-landscape', landscape);
    const label = landscape ? 'Rotate to portrait' : 'Rotate to landscape';
    rotate.setAttribute('aria-label', label);
    rotate.dataset.tip = label;
  }

  rotate.addEventListener('click', () => {
    if (rotating) return;
    const toLandscape = !postcard.classList.contains('landscape');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || !postcard.animate) { applyOrientation(toLandscape); return; }

    // Measure the target size so the turned card lands exactly on it
    const from = postcard.getBoundingClientRect();
    postcard.classList.toggle('landscape', toLandscape);
    const to = postcard.getBoundingClientRect();
    postcard.classList.toggle('landscape', !toLandscape);
    const scale = to.width / from.height;

    // Fade out what's printed on the card while it turns, so the switch to the
    // other layout happens while it's invisible (the empty-state plus stays put)
    const content = [backArea, photo].filter(el => !el.hidden && !el.parentElement.hidden);
    const fadeOuts = content.map(el => el.animate(
      [{ opacity: 1 }, { opacity: 0 }],
      { duration: 160, easing: 'ease-out', fill: 'forwards' }
    ));

    // Quarter turn around the card's centre: anticlockwise to landscape, clockwise back
    const angle = toLandscape ? -90 : 90;
    rotating = true;
    const anim = postcard.animate(
      [
        { transform: 'rotate(0deg) scale(1)' },
        { transform: `rotate(${angle}deg) scale(${scale})` }
      ],
      { duration: 400, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' }
    );
    anim.onfinish = () => {
      applyOrientation(toLandscape);
      content.forEach(el => el.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 180, easing: 'ease-in' }
      ));
      fadeOuts.forEach(a => a.cancel());
      rotating = false;
    };
  });

  // Drag and drop onto the empty postcard
  empty.addEventListener('dragover', (e) => { e.preventDefault(); empty.classList.add('dragging'); });
  empty.addEventListener('dragleave', () => empty.classList.remove('dragging'));
  empty.addEventListener('drop', (e) => {
    e.preventDefault();
    empty.classList.remove('dragging');
    showPhoto(e.dataTransfer.files[0]);
  });
</script>

</body>
</html>
