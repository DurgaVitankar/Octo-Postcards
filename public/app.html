<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.postcard {
  width: 432px;
  height: 600px;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 2px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.plus-icon {
  width: 44px;
  height: 44px;
  border: 1.5px solid #c8c8c8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c0c0c0;
  font-size: 22px;
  line-height: 1;
  transition: border-color 0.2s, color 0.2s;
}

.add-label {
  font-size: 13px;
  color: #c0c0c0;
  opacity: 0;
  transition: opacity 0.2s;
  letter-spacing: 0.01em;
}

.postcard:hover .plus-icon {
  border-color: #999;
  color: #888;
}

.postcard:hover .add-label {
  opacity: 1;
}
</style>
</head>
<body>

<div class="postcard">
  <div class="plus-icon">+</div>
  <span class="add-label">Add photo</span>
</div>

</body>
</html>
